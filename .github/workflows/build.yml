name: Build APK

on:
  push:
    paths: ["app/**", "server/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - run: python -m pytest -q server/tests

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze & test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      # (선택) Secrets에 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD 를 넣으면
      # 항상 같은 서명 → 새 APK를 기존 앱 위에 덮어 설치 가능
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/babymind.keystore"
          echo "BABYMIND_KEYSTORE=$RUNNER_TEMP/babymind.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: app
        env:
          BABYMIND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: babymind-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      # 휴대폰에서 바로 받을 수 있게 'latest-apk' 릴리스를 최신 빌드로 교체
      - name: Publish latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk BabyMind.apk
          gh release delete latest-apk --cleanup-tag -y || true
          gh release create latest-apk BabyMind.apk --target "$GITHUB_SHA" --prerelease \
            --title "BabyMind 최신 APK (#${{ github.run_number }})" \
            --notes "브랜치: ${GITHUB_REF_NAME} / 커밋: ${GITHUB_SHA::7}. 휴대폰에서 BabyMind.apk 를 눌러 설치하세요."
